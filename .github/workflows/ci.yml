name: CI - API-Data-Hora

on:
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Construir imagem Docker 
        run: docker build -t api-data-hora .
